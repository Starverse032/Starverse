<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05040a">
<meta name="description" content="潜空间激斗 LATENT CLASH — Claude 娘 vs DeepSeek 娘，像素风格浏览器格斗游戏。">
<title>潜空间激斗 LATENT CLASH</title>
<style id="lc-style">
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #05040a;
    background-image:
      radial-gradient(ellipse 70% 60% at 50% 42%, rgba(35, 31, 69, 0.55) 0%, rgba(11, 10, 20, 0.0) 70%),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 3px);
    color: #9b96b8; font-family: system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  #lc-root {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #lc-screen {
    position: fixed; display: block; outline: none; background: #05040a;
    image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; image-rendering: pixelated;
    box-shadow: 0 0 0 1px #15132a, 0 0 48px rgba(77, 107, 254, 0.07), 0 0 24px rgba(217, 119, 87, 0.05);
    touch-action: none; cursor: default;
  }
  #lc-crt { position: fixed; pointer-events: none; display: none; }
  #lc-fs {
    position: fixed; width: 30px; height: 30px; padding: 0; margin: 0; border: 0; border-radius: 4px;
    background: rgba(21, 19, 42, 0.55); cursor: pointer; opacity: 0.45; z-index: 5;
    transition: opacity 0.15s;
  }
  #lc-fs:hover, #lc-fs:focus-visible { opacity: 1; outline: none; }
  #lc-fs span {
    position: absolute; left: 8px; top: 8px; width: 14px; height: 14px;
    background:
      linear-gradient(#f4efe6, #f4efe6) 0 0 / 5px 2px no-repeat, linear-gradient(#f4efe6, #f4efe6) 0 0 / 2px 5px no-repeat,
      linear-gradient(#f4efe6, #f4efe6) 100% 0 / 5px 2px no-repeat, linear-gradient(#f4efe6, #f4efe6) 100% 0 / 2px 5px no-repeat,
      linear-gradient(#f4efe6, #f4efe6) 0 100% / 5px 2px no-repeat, linear-gradient(#f4efe6, #f4efe6) 0 100% / 2px 5px no-repeat,
      linear-gradient(#f4efe6, #f4efe6) 100% 100% / 5px 2px no-repeat, linear-gradient(#f4efe6, #f4efe6) 100% 100% / 2px 5px no-repeat;
  }
  #lc-touch { position: fixed; inset: 0; pointer-events: none; z-index: 4; display: none; }
  .lc-tc { position: fixed; pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; }
  .lc-tc canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; image-rendering: pixelated;
    transition: transform 0.05s;
  }
  .lc-tc.on canvas { transform: scale(0.93) translateY(1px); }
  #lc-touch.lc-overlay .lc-tc { opacity: 0.5; }
  #lc-touch.lc-overlay .lc-tc.on { opacity: 0.8; }
  #lc-touch.lc-overlay .lc-dpad { opacity: 0.45; }
  noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f4efe6; }
</style>
</head>
<body>
<div id="lc-root"></div>
<noscript>潜空间激斗需要启用 JavaScript。 / LATENT CLASH needs JavaScript.</noscript>
<script src="src/shared/loader.js" data-root="src/" data-modules="all"></script>
<script>LC.app.boot();</script>
</body>
</html>
