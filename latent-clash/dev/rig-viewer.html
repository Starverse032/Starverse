<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>LATENT CLASH — RIG viewer</title>
<style>
body{margin:0;background:#16151d;color:#ddd;font:12px/1.4 monospace;display:flex;gap:10px;padding:8px}
#side{width:250px;flex:none}#side label{display:block;margin:3px 0}select,button{font:12px monospace}
#anims{width:100%;height:300px}canvas{image-rendering:pixelated;display:block}
#tl{height:22px;position:relative;background:#222;margin-top:4px;cursor:pointer}
#tl div{position:absolute;top:0;height:22px;border-right:1px solid #000;font-size:10px;overflow:hidden;white-space:nowrap;color:#000}
#cur{position:absolute;top:0;width:2px;height:22px;background:#fff}
#info{white-space:pre;margin-top:6px;color:#aaa}
</style></head><body>
<div id="side">
  <label>char <select id="char"></select> pal <select id="pal"><option>0</option><option>1</option></select></label>
  <select id="anims" size="20"></select>
  <label><button id="play">pause</button> <button id="prev">&lt;</button> <button id="next">&gt;</button>
    speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
  <label>zoom <select id="zoom"><option>4</option><option selected>5</option><option>6</option><option>8</option></select>
    facing <select id="facing"><option>1</option><option>-1</option></select></label>
  <label><input type="checkbox" id="anch" checked> anchors <input type="checkbox" id="bnds"> bounds</label>
  <label><input type="checkbox" id="onion"> onion skin <input type="checkbox" id="grid"> 16px grid</label>
  <label><input type="checkbox" id="gnd" checked> ground <input type="checkbox" id="flash"> flash <input type="checkbox" id="sil"> silhouette</label>
  <label><input type="checkbox" id="move"> move mode (A/D walk, W jump, S crouch, Shift+A/D dash)</label>
  <div id="info"></div>
</div>
<div>
  <canvas id="view"></canvas>
  <div id="tl"><span id="cur"></span></div>
  <div style="margin-top:8px">both characters at game scale (×2):</div>
  <canvas id="vs"></canvas>
</div>
<script src="../src/shared/loader.js" data-root="../src/" data-modules="rig"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var VW = 320, VH = 220, GY = 196;   // V2: 104-px fighters
  var view = $('view'), vctx = view.getContext('2d'); view.width = VW; view.height = VH;
  var vs = $('vs'), sctx = vs.getContext('2d'); vs.width = 384; vs.height = 216; vs.style.width = '768px';
  vctx.imageSmoothingEnabled = false; sctx.imageSmoothingEnabled = false;
  var pup = null, onionP = null, frame = 0, playing = true, acc = 0;
  var env = { x: 0, y: 0, vx: 0, vy: 0, facing: 1, grounded: true };
  var keys = {}, mv = { state: 'idle', t: 0, vy: 0 };
  var vsP = [];

  LC.rig.init().then(function () {
    Object.keys(LC.rig._.CHARS).forEach(function (c) { $('char').add(new Option(c)); });
    var q = new URLSearchParams(location.search);
    if (q.get('char')) $('char').value = q.get('char');
    rebuild(q.get('anim'));
    ['char', 'pal'].forEach(function (id) { $(id).onchange = function () { rebuild(); }; });
    $('anims').onchange = function () { frame = 0; };
    $('play').onclick = function () { playing = !playing; this.textContent = playing ? 'pause' : 'play'; };
    $('prev').onclick = function () { playing = false; frame = Math.max(0, frame - 1); };
    $('next').onclick = function () { playing = false; frame++; };
    $('zoom').onchange = sizeView; sizeView();
    $('tl').onclick = function (e) {
      var info = LC.rig.animInfo($('char').value, $('anims').value), r = this.getBoundingClientRect();
      frame = Math.floor((e.clientX - r.left) / r.width * info.total); playing = false;
    };
    addEventListener('keydown', function (e) { keys[e.key.toLowerCase()] = true; keys.shift = e.shiftKey; });
    addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; keys.shift = e.shiftKey; });
    setInterval(tick, 1000 / 60);
  });

  function sizeView() { var z = +$('zoom').value; view.style.width = VW * z + 'px'; view.style.height = VH * z + 'px'; $('tl').style.width = VW * z + 'px'; }
  function rebuild(sel) {
    var c = $('char').value, pal = +$('pal').value, list = $('anims'), cur = sel || list.value || 'idle';
    list.innerHTML = '';
    LC.rig.listAnims(c).forEach(function (n) {
      var inf = LC.rig.animInfo(c, n);
      list.add(new Option(n + (inf.placeholder ? '  (placeholder)' : '') + '  ' + inf.total + 'f', n));
    });
    list.value = LC.rig.hasAnim(c, cur) ? cur : 'idle';
    pup = LC.rig.createPuppet(c, { palette: pal }); onionP = LC.rig.createPuppet(c, { palette: pal });
    vsP = [LC.rig.createPuppet('claude', { palette: 0 }), LC.rig.createPuppet('deepseek', { palette: c === 'deepseek' ? 0 : 0 })];
    frame = 0; env.x = 0;
  }

  function moveLogic(c) {
    // tiny state machine to judge secondary motion (not the fight engine)
    var info = function (n) { return LC.rig.animInfo(c, n); };
    var walk = c === 'claude' ? [1.3, 1.0] : [1.7, 1.3];
    mv.t++;
    if (mv.state === 'jump') {
      mv.vy += 0.32; env.y += mv.vy; env.vy = mv.vy;
      if (env.y >= 0) { env.y = 0; env.vy = 0; mv.state = 'land'; mv.t = 0; }
      return mv.vy < 0 ? ['jumpRise', mv.t] : ['jumpFall', mv.t];
    }
    if (mv.state === 'land' && mv.t < 6) return ['land', mv.t];
    if (mv.state === 'dash' && mv.t < info(mv.anim).total) { env.vx = mv.dir * (c === 'claude' ? 3.1 : 4.5) * (1 - mv.t / info(mv.anim).total); env.x += env.vx; return [mv.anim, mv.t]; }
    if (mv.state === 'squat') { if (mv.t >= 4) { mv.state = 'jump'; mv.vy = -6.2; mv.t = 0; } return ['jumpSquat', mv.t]; }
    mv.state = 'idle';
    env.vx = 0;
    if (keys.w) { mv.state = 'squat'; mv.t = 0; return ['jumpSquat', 0]; }
    if (keys.s) return ['crouch', mv.t];
    var dir = keys.d ? 1 : (keys.a ? -1 : 0);
    if (dir && keys.shift) { mv.state = 'dash'; mv.t = 0; mv.dir = dir; mv.anim = dir === env.facing ? 'dashF' : 'dashB'; return [mv.anim, 0]; }
    if (dir) {
      var fwd = dir === env.facing; env.vx = dir * (fwd ? walk[0] : walk[1]); env.x += env.vx;
      if (env.x > 120) env.x = -120; if (env.x < -120) env.x = 120;
      return [fwd ? 'walkF' : 'walkB', mv.t];
    }
    return ['idle', mv.t];
  }

  function tick() {
    if (!pup) return;
    var c = $('char').value, an = $('anims').value, info = LC.rig.animInfo(c, an);
    env.facing = +$('facing').value;
    var f = frame, anim = an;
    if ($('move').checked) { var r = moveLogic(c); anim = r[0]; f = r[1]; }
    else { env.x = 0; env.y = 0; env.vx = 0; env.vy = 0; }
    pup.setPose(anim, f);
    pup.tick(env);
    if (playing && !$('move').checked) { acc += +$('speed').value; while (acc >= 1) { acc -= 1; frame++; } }
    if (!info.loop && frame > info.total + 20) frame = 0;
    render(anim, f, info);
    renderVs(an);
  }

  function render(anim, f, info) {
    var g = vctx, ox = VW / 2 + Math.round(env.x), oy = GY + Math.round(env.y);
    g.fillStyle = '#4d5468'; g.fillRect(0, 0, VW, VH);
    if ($('grid').checked) { g.fillStyle = '#565d73'; for (var x = (VW / 2) % 16; x < VW; x += 16) g.fillRect(x, 0, 1, VH); for (var y = GY % 16; y < VH; y += 16) g.fillRect(0, y, VW, 1); }
    if ($('gnd').checked) { g.fillStyle = '#2c3040'; g.fillRect(0, GY, VW, VH - GY); }
    if ($('onion').checked && !$('move').checked) {
      [-4, 4].forEach(function (d) {
        onionP.setPose(anim, Math.max(0, f + d)); onionP.tick({ x: 0, y: 0, facing: env.facing });
        onionP.draw(g, ox, oy, { facing: env.facing, silhouette: d < 0 ? '#ff5080' : '#50c0ff', alpha: 0.35 });
      });
    }
    pup.draw(g, ox, oy, { facing: env.facing, flash: $('flash').checked ? 0.6 : 0, silhouette: $('sil').checked ? '#ffffff' : null });
    var fc = env.facing;
    if ($('bnds').checked) { var b = pup.getBounds(); g.strokeStyle = '#ff0'; g.lineWidth = 1; g.strokeRect(ox + (fc > 0 ? b.x : -b.x - b.w) + 0.5, oy + b.y + 0.5, b.w, b.h); }
    if ($('anch').checked) {
      ['head', 'chest', 'hip', 'center', 'handF', 'handB', 'footF', 'footB', 'top', 'muzzle', 'weapon', 'grab'].forEach(function (n) {
        var a = pup.getAnchor(n);
        g.fillStyle = n === 'weapon' || n === 'muzzle' ? '#ff2050' : (n === 'grab' ? '#20ff60' : '#20d0ff');
        g.fillRect(ox + fc * a.x, oy + a.y, 1, 1);
      });
    }
    // timeline
    var tl = $('tl'), tot = info.total, cols = ['#c9a', '#9ca', '#ac9', '#aac', '#cc9', '#9cc', '#c99'];
    if (tl.dataset.k !== anim + tot) {
      tl.querySelectorAll('div').forEach(function (d) { d.remove(); });
      var acc2 = 0;
      info.segs.forEach(function (s, i) {
        var d = document.createElement('div'); d.style.left = (acc2 / tot * 100) + '%'; d.style.width = (s.f / tot * 100) + '%';
        d.style.background = cols[i % cols.length]; d.textContent = s.id + ' ' + s.f + (s.loop ? '*' : ''); tl.appendChild(d); acc2 += s.f;
      });
      tl.dataset.k = anim + tot;
    }
    var pi = pup.info();
    $('cur').style.left = Math.min(100, pi.abs / tot * 100) + '%';
    $('info').textContent = 'anim ' + pi.anim + '\nseg ' + pi.seg + '  t ' + pi.t.toFixed(1) + '\nframe ' + f + '/' + tot +
      (info.placeholder ? '\nPLACEHOLDER' : '') + '\nrenders ' + LC.rig.stats.renders;
  }

  function renderVs(an) {
    var g = sctx;
    for (var y = 0; y < 216; y++) { g.fillStyle = 'hsl(' + (230 + y * 0.1) + ',20%,' + (24 + y * 0.12) + '%)'; g.fillRect(0, y, 384, 1); }
    g.fillStyle = '#3a3346'; g.fillRect(0, 186, 384, 30);
    var t = (performance.now() / 16.67) | 0;
    vsP.forEach(function (p, i) {
      var c = i ? 'deepseek' : 'claude', a = LC.rig.hasAnim(c, an) ? an : 'idle';
      p.setPose(a, t % (LC.rig.animInfo(c, a).total + (LC.rig.animInfo(c, a).loop ? 0 : 30)));
      p.tick({ x: 0, y: 0, facing: i ? -1 : 1 });
      p.draw(g, i ? 236 : 148, 186, { facing: i ? -1 : 1 });
    });
  }
})();
</script>
</body></html>
